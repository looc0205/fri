name: Package Emby Docker image to GitHub Release

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker image to package"
        required: true
        type: string
        default: "amilys/embyserver_arm64v8"

      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - linux/arm64
          - linux/amd64
        default: linux/arm64

      release_tag:
        description: "GitHub Release tag. Leave empty to auto-generate."
        required: false
        type: string
        default: "emby-arm64"

      output_name:
        description: "Output file prefix. Leave empty to auto-generate."
        required: false
        type: string
        default: ""

      compression:
        description: "Compression format"
        required: true
        type: choice
        options:
          - gzip
          - zstd
          - none
        default: gzip

      compression_level:
        description: "Compression level. gzip/pigz: 1-9, zstd: 1-19"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "6"
          - "9"
          - "19"
        default: "1"

      split_size_mb:
        description: "Split size in MB. Keep below GitHub Release 2 GiB limit."
        required: true
        type: string
        default: "1900"

      retag_as:
        description: "Optional tag saved into archive. Leave empty to keep original image name."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  package:
    name: Package Emby Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare variables
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image }}"
          PLATFORM="${{ inputs.platform }}"
          COMPRESSION="${{ inputs.compression }}"
          COMPRESSION_LEVEL="${{ inputs.compression_level }}"
          SPLIT_SIZE_MB="${{ inputs.split_size_mb }}"
          RETAG_AS="${{ inputs.retag_as }}"

          SAFE_IMAGE="$(echo "$IMAGE" | sed 's#[/:@]#-#g')"
          SAFE_PLATFORM="$(echo "$PLATFORM" | sed 's#/#-#g')"

          if [ -n "${{ inputs.output_name }}" ]; then
            OUTPUT_NAME="${{ inputs.output_name }}"
          else
            OUTPUT_NAME="${SAFE_IMAGE}-${SAFE_PLATFORM}"
          fi

          if [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="offline-${SAFE_IMAGE}-${SAFE_PLATFORM}"
          fi

          case "$COMPRESSION" in
            gzip) EXT="tar.gz" ;;
            zstd) EXT="tar.zst" ;;
            none) EXT="tar" ;;
            *) echo "Unsupported compression: $COMPRESSION"; exit 1 ;;
          esac

          if ! [[ "$SPLIT_SIZE_MB" =~ ^[0-9]+$ ]]; then
            echo "split_size_mb must be a number"
            exit 1
          fi

          {
            echo "IMAGE=$IMAGE"
            echo "PLATFORM=$PLATFORM"
            echo "COMPRESSION=$COMPRESSION"
            echo "COMPRESSION_LEVEL=$COMPRESSION_LEVEL"
            echo "SPLIT_SIZE_MB=$SPLIT_SIZE_MB"
            echo "RETAG_AS=$RETAG_AS"
            echo "OUTPUT_NAME=$OUTPUT_NAME"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "EXT=$EXT"
          } >> "$GITHUB_ENV"

      - name: Install compression tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pigz zstd

      - name: Optional registry login
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${REGISTRY_USERNAME:-}" ] && [ -n "${REGISTRY_TOKEN:-}" ]; then
            REGISTRY="$(echo "$IMAGE" | awk -F/ '{print $1}')"
            echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
              -u "$REGISTRY_USERNAME" \
              --password-stdin
          else
            echo "No registry credentials provided. Skipping docker login."
          fi

      - name: Inspect remote image and verify platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker buildx imagetools inspect "$IMAGE" | tee dist/remote-inspect.txt

          if ! grep -q "$PLATFORM" dist/remote-inspect.txt; then
            echo "::error::Image $IMAGE does not provide platform $PLATFORM. Available platforms:"
            grep -Eo 'linux/[a-z0-9]+(/[a-z0-9]+)?' dist/remote-inspect.txt | sort -u || true
            exit 1
          fi

      - name: Pull image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform="$PLATFORM" "$IMAGE"

      - name: Optional retag image
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RETAG_AS" ]; then
            docker tag "$IMAGE" "$RETAG_AS"
            SAVE_IMAGE="$RETAG_AS"
          else
            SAVE_IMAGE="$IMAGE"
          fi
          echo "SAVE_IMAGE=$SAVE_IMAGE" >> "$GITHUB_ENV"

      - name: Verify local image architecture
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_ARCH="$(docker image inspect "$SAVE_IMAGE" --format '{{.Architecture}}')"
          LOCAL_OS="$(docker image inspect "$SAVE_IMAGE" --format '{{.Os}}')"
          LOCAL_PLATFORM="${LOCAL_OS}/${LOCAL_ARCH}"
          echo "Local image platform: $LOCAL_PLATFORM"
          if [ "$LOCAL_PLATFORM" != "$PLATFORM" ]; then
            echo "::error::Local image platform $LOCAL_PLATFORM does not match requested $PLATFORM"
            exit 1
          fi

      - name: Save image archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${OUTPUT_NAME}.${EXT}"

          case "$COMPRESSION" in
            gzip)
              docker save "$SAVE_IMAGE" | pigz "-${COMPRESSION_LEVEL}" > "$ARCHIVE"
              ;;
            zstd)
              docker save "$SAVE_IMAGE" | zstd "-${COMPRESSION_LEVEL}" -T0 -o "$ARCHIVE"
              ;;
            none)
              docker save -o "$ARCHIVE" "$SAVE_IMAGE"
              ;;
          esac

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Generate metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          docker image inspect "$SAVE_IMAGE" > dist/image-inspect.json
          docker image inspect "$SAVE_IMAGE" --format '{{json .RepoDigests}}' > dist/repo-digests.json || true

          {
            echo "Image: $IMAGE"
            echo "Saved as: $SAVE_IMAGE"
            echo "Platform: $PLATFORM"
            echo "Compression: $COMPRESSION"
            echo "Compression level: $COMPRESSION_LEVEL"
            echo "Archive: $ARCHIVE"
            echo "Created at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Docker version:"
            docker version --format '{{.Server.Version}}'
            echo
            echo "Repo digests:"
            cat dist/repo-digests.json || true
          } > dist/image-info.txt

      - name: Generate offline load script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/load.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "Checking SHA256 sums..."
          if [ -f SHA256SUMS.txt ]; then
            sha256sum -c --ignore-missing SHA256SUMS.txt
          else
            echo "SHA256SUMS.txt not found, skipping checksum verification."
          fi

          if ls *.part-* >/dev/null 2>&1; then
            first_part="$(ls *.part-* | head -n 1)"
            base="${first_part%%.part-*}"

            echo "Loading split archive: ${base}.part-*"

            case "$base" in
              *.tar.gz) cat "${base}".part-* | gzip -dc | docker load ;;
              *.tar.zst) cat "${base}".part-* | zstd -dc | docker load ;;
              *.tar) cat "${base}".part-* | docker load ;;
              *) echo "Unknown split archive type: $base"; exit 1 ;;
            esac
          else
            archive="$(find . -maxdepth 1 -type f \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tar.zst' \) | sort | head -n 1)"

            if [ -z "$archive" ]; then
              echo "No Docker archive found."
              exit 1
            fi

            echo "Loading archive: $archive"
            case "$archive" in
              *.tar.gz) gzip -dc "$archive" | docker load ;;
              *.tar.zst) zstd -dc "$archive" | docker load ;;
              *.tar) docker load -i "$archive" ;;
              *) echo "Unknown archive type: $archive"; exit 1 ;;
            esac
          fi

          echo "Done."
          EOF
          sed -i 's/^          //' dist/load.sh
          chmod +x dist/load.sh

      - name: Split archive if needed
        shell: bash
        run: |
          set -euo pipefail
          LIMIT_BYTES=$((SPLIT_SIZE_MB * 1024 * 1024))
          ARCHIVE_SIZE="$(stat -c%s "$ARCHIVE")"

          if [ "$ARCHIVE_SIZE" -gt "$LIMIT_BYTES" ]; then
            echo "Archive is larger than ${SPLIT_SIZE_MB}MB. Splitting..."
            split -b "${SPLIT_SIZE_MB}M" -d -a 3 "$ARCHIVE" "dist/${ARCHIVE}.part-"
            rm "$ARCHIVE"
            (cd dist && sha256sum "${ARCHIVE}".part-* > SHA256SUMS.txt)
          else
            mv "$ARCHIVE" dist/
            (cd dist && sha256sum "$ARCHIVE" > SHA256SUMS.txt)
          fi

          cat dist/SHA256SUMS.txt

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # Emby Docker image offline package

          ## Image

          - Image: \`$IMAGE\`
          - Saved as: \`$SAVE_IMAGE\`
          - Platform: \`$PLATFORM\`
          - Compression: \`$COMPRESSION\`
          - Compression level: \`$COMPRESSION_LEVEL\`

          ## Verify

          Download all release assets into the same directory, then run:

          \`\`\`bash
          sha256sum -c --ignore-missing SHA256SUMS.txt
          \`\`\`

          ## Load

          \`\`\`bash
          chmod +x load.sh
          ./load.sh
          \`\`\`

          ## Start your compose service

          \`\`\`bash
          docker compose up -d
          \`\`\`
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
